name: Database (hosted)

# Prepares the hosted review database (e.g. Neon) from GitHub, so no connection
# string ever has to be typed into a chat or a local machine.
# Repository secrets (Settings → Secrets and variables → Actions):
#   DATABASE_OWNER_URL  – direct (non-pooled) connection string of the owner role
#   APP_DB_PASSWORD     – password for the runtime role the app connects as (luma_app)
#   AUTH_SECRET         – the same value as in Vercel (32+ characters)
on:
  push:
    branches: [main]
    paths: ['db/migrations/**']
  workflow_dispatch:
    inputs:
      seed:
        description: 'Load demo data (only on an empty database)'
        type: boolean
        default: false

concurrency:
  group: database
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_OWNER_URL: ${{ secrets.DATABASE_OWNER_URL }}
      APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      DB_APP_ROLE: luma_app
    steps:
      - name: Check secrets
        run: |
          if [ -z "$DATABASE_OWNER_URL" ] || [ -z "$APP_DB_PASSWORD" ] || [ -z "$AUTH_SECRET" ]; then
            echo "::error::Add DATABASE_OWNER_URL, APP_DB_PASSWORD and AUTH_SECRET as repository secrets first."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create or update the runtime role (RLS applies to it)
        run: pnpm -s db:create-app-role
      - name: Apply migrations
        run: pnpm -s db:migrate
      - name: Load demo data
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed }}
        run: |
          # The app-role URL is derived in memory and masked; demo passwords are written
          # to a temp file that is deleted, never to the log (this repository is public).
          export DATABASE_URL="$(node -e 'const u=new URL(process.env.DATABASE_OWNER_URL);u.username=process.env.DB_APP_ROLE;u.password=process.env.APP_DB_PASSWORD;console.log(u.toString())')"
          echo "::add-mask::$DATABASE_URL"
          export APP_ENV=review STORAGE_DRIVER=db SEED_CREDENTIALS_JSON="$RUNNER_TEMP/demo-credentials.json"
          pnpm -s db:seed
          rm -f "$SEED_CREDENTIALS_JSON"
          echo "Demo data loaded. Set passwords for demo accounts with 'Forgot password' on the site (review builds show the code on screen)."
